apiVersion: apps/v1
kind: Deployment
metadata:
  name: mp301-api
  labels:
    app: mp301-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mp301-api
  template:
    metadata:
      labels:
        app: mp301-api
    spec:
      containers:
        - name: mp301-api
          image: mp301-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
